<style>

<script>
if(!window.claude)document.documentElement.classList.add('noai');
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
const $=s=>document.querySelector(s),te=new TextEncoder(),td=new TextDecoder();
const THEMES=['auto','light','dark'],THL={auto:'🌓 Automatisch',light:'☀️ Hell',dark:'🌙 Dunkel'},THI={auto:'🌓',light:'☀️',dark:'🌙'};
function getTheme(){try{const t=localStorage.getItem('ds_theme');return THEMES.includes(t)?t:'auto'}catch(e){return 'auto'}}
function applyTheme(t){const r=document.documentElement;if(t==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',t);const b=$('#lth');if(b)b.textContent='Darstellung: '+THL[t];const h=$('#hth');if(h)h.textContent=THI[t]}
function cycleTheme(){const t=THEMES[(THEMES.indexOf(getTheme())+1)%3];try{localStorage.setItem('ds_theme',t)}catch(e){}applyTheme(t)}
applyTheme(getTheme());
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let db,key,meta,cur=null,pend=[],timer,vid=null;
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('docsafe',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=(m,f)=>new Promise((res,rej)=>{const t=db.transaction('kv',m);const r=f(t.objectStore('kv'));t.oncomplete=()=>res(r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)});
let NS='';
const get=k=>tx('readonly',s=>s.get(NS+k)),put=(k,v)=>tx('readwrite',s=>s.put(v,NS+k)),del=k=>tx('readwrite',s=>s.delete(NS+k));
async function derive(pw,salt){const b=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},b,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function enc(o){const iv=crypto.getRandomValues(new Uint8Array(12));return{iv,ct:await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(JSON.stringify(o)))}}
async function dec(r){return JSON.parse(td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:r.iv},key,r.ct)))}
const saveMeta=async()=>{metaRev++;await put('meta',await enc(meta));schedSync()};
const uid=()=>crypto.randomUUID();
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fd=d=>d?new Date(d+'T00:00').toLocaleDateString('de-DE'):'–',fdt=d=>new Date(d).toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'});
const path=id=>{const p=[];while(id){const f=meta.folders.find(x=>x.id===id);if(!f)break;p.unshift(f.name);id=f.parent}return p.join(' / ')};
const opts=(sel,root)=>(root?`<option value="">${root}</option>`:'')+meta.folders.map(f=>({id:f.id,p:path(f.id)})).sort((a,b)=>a.p.localeCompare(b.p)).map(o=>`<option value="${o.id}"${o.id===sel?' selected':''}>${esc(o.p)}</option>`).join('');
const D=$('#dlg'),show=h=>{D.innerHTML='<div class="box"><div class="row"><button class="b2" data-a="hx">🏠 Startseite</button><button class="b2" data-a="x">← Zurück</button></div>'+h+'</div>';D.hidden=false},hide=()=>{D.hidden=true;D.innerHTML=''};
const nz=v=>v||null;

async function boot(){db=await idb();try{navigator.storage?.persist?.()}catch(e){}try{NS=localStorage.getItem('ds_ns')||''}catch(e){}const c0=await get('cfg');cfgV=c0?(c0.v||1):2;lockUI(!c0&&!SBC()&&!(await rawGet('cfg')))}
let first=false,cfgV=2,loginMail='';
const lastNS=()=>{try{return localStorage.getItem('ds_ns')||''}catch(e){return ''}};
function lockUI(f){first=f;key=null;meta=null;SS=null;loginMail='';pend=[];pendF=[];vp=[];vf=[];fsA=[];$('#fs').hidden=true;hide();$('#app').hidden=true;$('#lock').hidden=false;
$('#lt').textContent=f?'Registrieren':'Anmelden';$('#lb').textContent=f?'Registrieren':'Anmelden';$('#lmode').textContent=f?'Schon ein Konto? Anmelden':'Neu hier? Registrieren';
$('#pw2').hidden=!f;$('#lr').hidden=f;$('#lfp').hidden=f;$('#sm').hidden=false;$('#lbio').hidden=true;NS=lastNS();
if(!f&&db)bioOK().then(async ok=>{if(ok&&await get('bio')&&!key)$('#lbio').hidden=false}).catch(()=>{});
$('#lm').textContent=f?'Registriere dich mit E-Mail-Adresse und Passwort (mindestens 8 Zeichen, besser 12). Jeder Benutzer hat eigene, getrennte Dokumente. Es gibt keine Wiederherstellung: ohne Passwort sind die Daten unlesbar.'+(SBC()?'':' Ohne Server bleiben die Daten nur auf diesem Gerät.'):'Melde dich mit E-Mail und Passwort an.'+(SBC()?' Neues Handy? Einfach anmelden, deine Dokumente werden vom Server geladen.':'')+' Mit Backup: E-Mail und Passwort des Backups eingeben und „Aus Backup wiederherstellen“ tippen.';
$('#pw').value='';$('#pw2').value='';$('#le').textContent='';$('#ver').textContent='Version 21'}
const rawGet=k=>tx('readonly',s=>s.get(k));
async function nsOf(e){const h=await crypto.subtle.digest('SHA-256',te.encode('dokumentensafe-user|'+e.trim().toLowerCase()));return 'u'+Array.from(new Uint8Array(h).slice(0,10)).map(b=>b.toString(16).padStart(2,'0')).join('')+'/'}
const adoptLegacy=nns=>new Promise((res,rej)=>{const t=db.transaction('kv','readwrite'),s=t.objectStore('kv'),rq=s.openCursor();
rq.onsuccess=e=>{const c=e.target.result;if(!c)return;const k=c.key;if(typeof k==='string'&&!k.includes('/')){s.put(c.value,nns+k);c.delete()}c.continue()};
t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)});
async function doRegister(mail,pw,er){
if(pw.length<8){er('Mindestens 8 Zeichen.');return false}
if(pw!==$('#pw2').value){er('Passwörter stimmen nicht überein.');return false}
if(await get('cfg')){er('Diese E-Mail ist auf diesem Gerät schon registriert. Bitte anmelden.');return false}
let note='';
if(SBC()){er('Registriere am Server …');try{SS=await sbAuth(mail,pw,true)}catch(e){SS=null;
if(/already|registered|exists/i.test(e.message)){er('Diese E-Mail ist schon registriert. Bitte anmelden. Passwort vergessen? Dann muss der Betreiber das Konto auf dem Server löschen.');return false}
if(/signups? not allowed|sign ?up.*(disabled|not allowed)/i.test(e.message)){er('Die Registrierung ist auf diesem Server ausgeschaltet.');return false}
if(/Bestätigungs/.test(e.message))note=e.message;else{er(e.message==='Failed to fetch'?'Keine Verbindung zum Server.':e.message);return false}}}
const salt=crypto.getRandomValues(new Uint8Array(16));key=await derive(cred(mail,pw,2),salt);const chk=await enc({ok:1});
meta={folders:['Rentenbescheide','Lohnabrechnungen','Steuer','Versicherung','Verträge'].map(n=>({id:uid(),name:n,parent:null,m:Date.now()})),docs:[]};
await saveMeta();await put('cfg',{salt,chk,v:2});cfgV=2;loginMail=mail;if(SS)await put('sess',await enc(SS));
if(note)setTimeout(()=>st('☁️ '+note),500);return true}
async function doLogin(mail,pw,er){
let cfg=await get('cfg');
if(!cfg){const lg=await rawGet('cfg');
if(lg){try{const k=await derive(cred(mail,pw,lg.v||1),lg.salt);await crypto.subtle.decrypt({name:'AES-GCM',iv:lg.chk.iv},k,lg.chk.ct);await adoptLegacy(NS);cfg=await get('cfg')}catch(e){}}}
if(!cfg){if(!SBC()){er('Für diese E-Mail gibt es hier kein Konto. Bitte registrieren.');return false}return await pullFromServer(mail,pw,er)}
cfgV=cfg.v||1;key=await derive(cred(mail,pw,cfgV),cfg.salt);
try{await dec(cfg.chk)}catch(e){key=null;await new Promise(r=>setTimeout(r,1200));er('Falsche E-Mail oder falsches Passwort.');return false}
loginMail=mail;const m=await get('meta');meta=m?await dec(m):{folders:[],docs:[]};return true}
async function pullFromServer(mail,pw,er){er('Melde am Server an …');
try{SS=await sbAuth(mail,pw,false)}catch(e){SS=null;er(/Invalid login|invalid_credentials/i.test(e.message)?'Konto nicht gefunden oder Passwort falsch. Neu hier? Dann bitte registrieren.':(e.message==='Failed to fetch'?'Keine Verbindung zum Server.':e.message));return false}
const c=await sGet('cfg.json');if(!c){SS=null;er('Dieses Konto hat noch keine Daten auf dem Server.');return false}
const cj=JSON.parse(await c.text()),chk=upk(cj.chk),cv=cj.v||1,k=await derive(cred(mail,pw,cv),unb(cj.salt));
try{await crypto.subtle.decrypt({name:'AES-GCM',iv:chk.iv},k,chk.ct)}catch(e){SS=null;er('Falsche E-Mail oder falsches Passwort.');return false}
const docs=(await sList()).map(o=>o.name).filter(n=>/^doc-.+\.bin$/.test(n));let i=0;
for(const n of docs){i++;er('Lade Dokumente '+i+'/'+docs.length+' …');const b=await sGet(n);if(b)await put('doc:'+n.slice(4,-4),fromBin(await b.arrayBuffer()))}
const mb=await sGet('meta.bin');if(!mb){SS=null;er('Keine Daten auf dem Server.');return false}
await put('meta',fromBin(await mb.arrayBuffer()));await put('cfg',{salt:unb(cj.salt),chk,v:cv});
cfgV=cv;key=k;loginMail=mail;meta=await dec(await get('meta'));await put('sess',await enc(SS));return true}
async function unlock(){const pw=$('#pw').value,mail=$('#sm').value.trim().toLowerCase(),er=m=>{$('#le').textContent=m};er('');
if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail))return er('Bitte eine gültige E-Mail-Adresse eingeben.');
if(!pw)return er('Bitte Passwort eingeben.');
$('#lb').disabled=true;let ok=false;
try{NS=await nsOf(mail);ok=first?await doRegister(mail,pw,er):await doLogin(mail,pw,er)}
catch(e){key=null;meta=null;SS=null;er(e.message==='Failed to fetch'?'Keine Verbindung zum Server.':'Fehler: '+e.message)}
finally{$('#lb').disabled=false}
if(!ok||!key)return;
try{localStorage.setItem('ds_ns',NS)}catch(e){}
$('#lock').hidden=true;$('#app').hidden=false;cur=null;$('#q').value='';render();bump();syncOff=!!(await get('syncoff'));st(syncOff?'👤 '+loginMail+' · ☁️ Synchronisierung aus':(loginMail?'👤 '+loginMail:''));schedSync(800)}
$('#lmode').onclick=()=>lockUI(!first);
function bump(){clearTimeout(timer);if(key)timer=setTimeout(()=>lockUI(false),10*60*1000)}
['click','keydown','touchstart'].forEach(e=>document.addEventListener(e,bump,{passive:true}));
$('#lb').onclick=unlock;$('#pw').onkeydown=$('#pw2').onkeydown=e=>{if(e.key==='Enter')unlock()};
$('#q').oninput=render;

function render(){const q=$('#q').value.trim().toLowerCase();let h='';
if(!q){const ch=[];let i=cur;while(i){const f=meta.folders.find(x=>x.id===i);if(!f)break;ch.unshift(f);i=f.parent}
h+=`<div class="cr"><a data-a="open" data-i="">Start</a>`+ch.map(f=>` › <a data-a="open" data-i="${f.id}">${esc(f.name)}</a>`).join('')+`</div>`;
meta.folders.filter(f=>(f.parent||null)===cur).sort((a,b)=>a.name.localeCompare(b.name)).forEach(f=>{h+=`<div class="it" data-a="open" data-i="${f.id}">📁 <b>${esc(f.name)}</b></div>`})}
const docs=meta.docs.filter(d=>q?(d.name+' '+path(d.folder)).toLowerCase().includes(q):(d.folder||null)===cur).sort(sorter());
h+=docHtml(docs);
if(!docs.length&&!h.includes('class="it"'))h+='<p class="mu">Noch nichts vorhanden.</p>';
$('#list').innerHTML=h;$('#fo').hidden=!cur||!!q;$('#mg').hidden=cfgV===2;$('#nv').lastElementChild.disabled=!cur&&!q;if(V.v==='kacheln')ensureTh(docs)}

const A={
open:i=>{cur=nz(i);$('#q').value='';render()},
x:hide,lock:()=>lockUI(false),
back:()=>{if($('#q').value)$('#q').value='';else{const f=meta.folders.find(x=>x.id===cur);cur=f?(f.parent||null):null}render()},

sf:async()=>{const n=$('#n').value.trim();if(!n)return $('#em').textContent='Bitte einen Namen eingeben.';const p=nz($('#f').value);
if(meta.folders.some(f=>(f.parent||null)===p&&f.name.toLowerCase()===n.toLowerCase()))return $('#em').textContent='Ordner existiert bereits.';
meta.folders.push({id:uid(),name:n,parent:p,m:Date.now()});await saveMeta();hide();render()},

A.fp2=async(i,b)=>{const mail=($('#fpm').value||'').trim().toLowerCase(),em=$('#em');
if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail)){em.textContent='Bitte die E-Mail-Adresse eingeben.';return}
if(!b.dataset.s){b.dataset.s='1';b.textContent='Ja, endgültig löschen';em.textContent='Alle Dokumente dieses Benutzers gehen auf diesem Gerät verloren.';return}
try{const ns=await nsOf(mail),n=await delKeys(k=>k.startsWith(ns));try{if(localStorage.getItem('ds_ns')===ns)localStorage.removeItem('ds_ns')}catch(e){}
hide();lockUI(true);$('#sm').value=mail;
$('#le').textContent=n?'Gelöscht. Du kannst dich jetzt mit dieser E-Mail neu registrieren.'+(SBC()?' Ist die E-Mail schon am Server registriert, muss das Konto dort zuerst vom Betreiber gelöscht werden (Supabase: Authentication → Users, Storage → vault).':''):'Für diese E-Mail waren auf diesem Gerät keine Daten gespeichert.'}
catch(e){em.textContent='Fehlgeschlagen: '+(e.message||e.name)}};
A.fp3=async(i,b)=>{const em=$('#em');if(!b.dataset.s){b.dataset.s='1';b.textContent='Ja, alten Tresor endgültig löschen';em.textContent='Der alte Tresor ohne E-Mail wird unwiderruflich gelöscht.';return}
try{await delKeys(k=>!k.includes('/'));hide();lockUI(false);$('#le').textContent='Der alte Tresor wurde gelöscht.'}catch(e){em.textContent='Fehlgeschlagen: '+(e.message||e.name)}};
$('#lfp').onclick=()=>A.fp();
async function syncPush(){if(syBusy)throw new Error('Es läuft gerade eine Synchronisierung. Bitte kurz warten.');if(!key||!meta)return;if(!(await sessGet()))throw new Error('Nicht angemeldet.');syBusy=true;
try{st('☁️ Überschreibe Server …');const lc=await get('cfg'),lcj={salt:b64(lc.salt),chk:pk(lc.chk),v:lc.v||1};
const names=(await sList()).map(o=>o.name);let rm=null;
if(names.includes('meta.bin')){const mb=await sGet('meta.bin');if(mb){try{rm=await dec(fromBin(await mb.arrayBuffer()))}catch(e){}}}
const now=Date.now(),lids=new Set(meta.docs.map(d=>d.id)),fids=new Set(meta.folders.map(f=>f.id)),tomb=new Map((meta.tomb||[]).map(t=>[t.id,t.t]));
if(rm){for(const d of rm.docs)if(!lids.has(d.id))tomb.set(d.id,now);for(const f of rm.folders)if(!fids.has(f.id))tomb.set(f.id,now)}
for(const id of lids)tomb.delete(id);for(const id of fids)tomb.delete(id);
for(const d of meta.docs){d.m=now;d.r=(d.r||0)+1}for(const f of meta.folders)f.m=now;
meta.tomb=[...tomb].map(([id,t])=>({id,t}));
await sPut('cfg.json',new Blob([JSON.stringify(lcj)],{type:'application/json'}));
let n=0;for(const d of meta.docs){const rec=await get('doc:'+d.id);if(rec){await sPut('doc-'+d.id+'.bin',new Blob([toBin(rec)],{type:'application/octet-stream'}));n++;st('☁️ Lade hoch … '+n)}}
const rec=await enc(meta);await put('meta',rec);await sPut('meta.bin',new Blob([toBin(rec)],{type:'application/octet-stream'}));
const keep=new Set(['cfg.json','meta.bin'].concat(meta.docs.map(d=>'doc-'+d.id+'.bin')));
await sDel(names.filter(x=>!keep.has(x)&&/^(doc-.+\.bin|meta\.bin|cfg\.json)$/.test(x)));
metaRev++;lastSync=new Date().toLocaleString('de-DE');st('☁️ Server überschrieben '+lastSync)}
catch(e){st('☁️ Fehler: '+e.message);throw e}finally{syBusy=false}}
async function syncPull(){if(syBusy)throw new Error('Es läuft gerade eine Synchronisierung. Bitte kurz warten.');if(!key||!meta)return;if(!(await sessGet()))throw new Error('Nicht angemeldet.');syBusy=true;
try{st('☁️ Lade vom Server …');const rc=await sGet('cfg.json');if(!rc)throw new Error('Auf dem Server liegen noch keine Daten.');
const j=JSON.parse(await rc.text()),lc=await get('cfg');if(j.salt!==b64(lc.salt))throw new Error('Auf dem Server liegt ein anderer Tresor. Dieses Gerät kann ihn nicht lesen.');
const names=(await sList()).map(o=>o.name),mb=await sGet('meta.bin');if(!mb)throw new Error('Keine Daten auf dem Server.');
let rm;try{rm=await dec(fromBin(await mb.arrayBuffer()))}catch(e){throw new Error('Das Passwort passt nicht zu den Server-Daten.')}
const sids=new Set(rm.docs.map(d=>d.id));let n=0;
for(const d of rm.docs){const nm='doc-'+d.id+'.bin';if(!names.includes(nm))continue;const b=await sGet(nm);if(b){await put('doc:'+d.id,fromBin(await b.arrayBuffer()));n++;st('☁️ Lade herunter … '+n)}}
for(const d of meta.docs)if(!sids.has(d.id))await del('doc:'+d.id);
meta=rm;await put('meta',await enc(meta));metaRev++;lastSync=new Date().toLocaleString('de-DE');st('☁️ Vom Server geladen '+lastSync);render()}
catch(e){st('☁️ Fehler: '+e.message);throw e}finally{syBusy=false}}
A.sy5=async()=>{syncOff=!syncOff;try{if(syncOff)await put('syncoff',1);else await del('syncoff')}catch(e){}st(syncOff?'☁️ Synchronisierung aus':'☁️ Synchronisierung ein');if(!syncOff)schedSync(3000);A.sy()};
A.sy6=async(i,b)=>{const em=$('#em');if(!b.dataset.s){b.dataset.s='1';b.textContent='Ja, Server überschreiben';em.className='er';em.textContent='Der Server-Stand wird durch den Stand dieses Geräts ersetzt. Dokumente, die nur auf dem Server liegen, werden dort gelöscht.';return}
em.className='mu';em.textContent='Überschreibe …';try{await syncPush();em.textContent='Fertig. Der Server entspricht jetzt diesem Gerät.'}catch(e){em.className='er';em.textContent=e.message==='Failed to fetch'?'Keine Verbindung zum Server.':e.message}};
A.sy7=async(i,b)=>{const em=$('#em');if(!b.dataset.s){b.dataset.s='1';b.textContent='Ja, dieses Gerät überschreiben';em.className='er';em.textContent='Der Stand dieses Geräts wird durch den Server-Stand ersetzt. Dokumente, die nur auf diesem Gerät liegen, werden gelöscht.';return}
em.className='mu';em.textContent='Lade …';try{await syncPull();em.textContent='Fertig. Dieses Gerät entspricht jetzt dem Server.'}catch(e){em.className='er';em.textContent=e.message==='Failed to fetch'?'Keine Verbindung zum Server.':e.message}};
A.th=()=>cycleTheme();$('#lth').onclick=cycleTheme;
let busy=false;
const toBlob=u=>{const bin=atob(u.split(',')[1]),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:'image/jpeg'})};
async function analyze(){const em=$('#em');if(busy||!em)return;if(!pend.length){em.textContent='Bitte zuerst eine Seite hinzufügen.';return}
let s=null;try{s=window.claude?await claude.use('sample'):null}catch(e){}
if(!s){em.textContent='Automatische Erkennung ist hier nicht verfügbar. Bitte Name und Datum selbst eintragen.';return}
busy=true;em.style.color='var(--mu)';em.textContent='Erkenne Datum und Betreff …';
const paths=meta.folders.map(f=>path(f.id));
try{const r=await s.json('Du liest einen Brief bzw. ein Dokument (die Bilder sind die Seiten). Antworte NUR mit JSON: {"datum":"YYYY-MM-DD oder null","betreff":"worum es geht, max. 6 Wörter, deutsch, ohne Sonderzeichen","kategorie":"genau einer der Werte aus der Liste oder null"}. datum = Ausstellungs- bzw. Briefdatum, nicht Fristen, Geburtstage oder Zeiträume. Kategorien: '+JSON.stringify(paths),{images:pend.slice(0,3).map(toBlob)});
if(!$('#n'))return;
const ok=/^\d{4}-\d{2}-\d{2}$/.test(r?.datum||''),b=String(r?.betreff||'').replace(/[\\\/:*?"<>|]/g,' ').replace(/\s+/g,' ').trim();
if(ok)$('#d').value=r.datum;if(b)$('#n').value=(ok?r.datum+' ':'')+b;
const k=meta.folders.find(f=>path(f.id)===r?.kategorie);if(k)$('#f').value=k.id;
em.textContent=(ok||b)?'Erkannt – bitte kurz prüfen.':'Nichts erkannt, bitte selbst eintragen.'}
catch(e){em.style.color='';em.textContent=e.code==='not_granted'?'Erkennung nicht erlaubt.':e.code==='rate_limited'?'Zu viele Anfragen, bitte später erneut.':'Erkennung fehlgeschlagen ('+(e.code||'Fehler')+').'}
finally{busy=false}}
boot();
</script></body></html>
